<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Contribution Calculator</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:1000px;
  margin:28px auto;
  padding:0 16px;
  background:#f6f7f9;
  color:#202124
}

.card{
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 2px 12px #0001
}

h1{margin:0 0 8px}
.sub{color:#555;margin-bottom:22px}

.controls{
  display:flex;
  gap:12px;
  align-items:end;
  flex-wrap:wrap;
  background:#f2f4f7;
  padding:14px;
  border-radius:12px
}

label{font-weight:700}

input,select{
  box-sizing:border-box;
  padding:10px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px
}

.controls input{width:120px}

button{
  padding:11px 15px;
  border:0;
  border-radius:8px;
  background:#202124;
  color:white;
  font-weight:700;
  cursor:pointer
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px
}

th,td{
  padding:11px 8px;
  border-bottom:1px solid #ddd;
  text-align:right
}

th:first-child,td:first-child{text-align:left}

td input{
  width:110px;
  text-align:right
}

td select{width:85px}

.result{font-weight:700}

.note{
  font-size:13px;
  color:#666;
  margin-top:16px
}

  td input{width:75px;padding:7px}
